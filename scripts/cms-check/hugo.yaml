# Module-free content audit. All drafts are included by check-cms.mjs.
baseURL: https://highfunctioningprogrammer.github.io/research-group-page-demo/
disableKinds: [taxonomy, term, RSS, sitemap]
outputs:
  home: [JSON]
module:
  mounts:
    - source: ../../content
      target: content
      files: ['! authors/_content.gotmpl']
    - source: ../../data
      target: data
    - source: ../../assets
      target: assets
    - source: ../../static
      target: assets/cms-static
    - source: ../../.pages.yml
      target: assets/cms-config.yaml
    - source: layouts
      target: layouts
